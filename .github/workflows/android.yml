
name: Build Lucas VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract source archive
        run: unzip -q LucasVPN-1.3-source-safe.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source/LucasVPN assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LucasVPN-debug-apk
          path: source/LucasVPN/app/build/outputs/apk/debug/app-debug.apk
          
